{# templates/accounts/auth_base.html #}
{% load tailwind_cli %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  {% tailwind_css %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="flex min-h-full items-center justify-center px-4 py-12 text-slate-800">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-household text-white">
        <i class="fa-solid fa-wallet text-xl"></i>
      </div>
      <h1 class="text-xl font-semibold">{% block heading %}{% endblock %}</h1>
    </div>
    <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
